apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
  namespace: civicpulse
type: Opaque
stringData:
  # PLACEHOLDERS ONLY - Injected via GitHub Actions or sealed-secrets in production (§3.3, §5.3)
  POSTGRES_USER: "civicpulse_user"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_SECRET"
  GROQ_API_KEY: "CHANGE_ME_GROQ_API_KEY_PLACEHOLDER"
  GEMINI_API_KEY: "CHANGE_ME_GEMINI_API_KEY_PLACEHOLDER"
